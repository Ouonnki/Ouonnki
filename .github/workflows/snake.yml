name: Generate contribution snake

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%237C3AED&color_dots=%23EBEDF0,%23DDD6FE,%23C4B5FD,%2367E8F9,%230891B2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23F0ABFC&color_dots=%23161B22,%23312E81,%236D28D9,%2306B6D4,%2367E8F9

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
